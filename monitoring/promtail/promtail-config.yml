server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: suricata-eve
    static_configs:
      - targets:
          - localhost
        labels:
          job: suricata
          service: suricata
          log_type: eve
          __path__: /var/log/suricata/eve.json
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            event_type: event_type
            src_ip: src_ip
            dest_ip: dest_ip
            dest_port: dest_port
            proto: proto
            alert_signature: alert.signature
            alert_severity: alert.severity
            dns_query: dns.rrname
            http_hostname: http.hostname
            http_url: http.url
      - labels:
          event_type:
          proto:
          alert_severity:
      - timestamp:
          source: timestamp
          format: "2006-01-02T15:04:05.999999-0700"
