%YAML 1.1
---

vars:
  # HOME_NET is scoped to the monitored asset itself: Suricata shares that
  # container's netns and protects it, so the attack simulator (10.10.0.40) and
  # the traffic generator (10.10.0.30) are EXTERNAL_NET. This is what lets ET
  # Open's `$EXTERNAL_NET -> $HTTP_SERVERS` rules fire against an in-lab
  # attacker (plan §3.2). The full standard variable set below is required —
  # ET Open references all of these, and an undefined one fails rule loading.
  address-groups:
    HOME_NET: "[10.10.0.20/32]"
    EXTERNAL_NET: "!$HOME_NET"
    HTTP_SERVERS: "$HOME_NET"
    SMTP_SERVERS: "$HOME_NET"
    SQL_SERVERS: "$HOME_NET"
    DNS_SERVERS: "$HOME_NET"
    TELNET_SERVERS: "$HOME_NET"
    AIM_SERVERS: "$EXTERNAL_NET"
    DC_SERVERS: "$HOME_NET"
    DNP3_SERVER: "$HOME_NET"
    DNP3_CLIENT: "$HOME_NET"
    MODBUS_CLIENT: "$HOME_NET"
    MODBUS_SERVER: "$HOME_NET"
    ENIP_CLIENT: "$HOME_NET"
    ENIP_SERVER: "$HOME_NET"
    FTP_SERVERS: "$HOME_NET"
  port-groups:
    HTTP_PORTS: "80"
    SHELLCODE_PORTS: "!80"
    ORACLE_PORTS: 1521
    SSH_PORTS: 22
    DNP3_PORTS: 20000
    MODBUS_PORTS: 502
    FILE_DATA_PORTS: "[$HTTP_PORTS,110,143]"
    FTP_PORTS: 21
    GENEVE_PORTS: 6081
    VXLAN_PORTS: 4789
    TEREDO_PORTS: 3544

default-log-dir: /var/log/suricata
# ET Open lands in the suricata-rules volume via scripts/update-rules.sh.
default-rule-path: /var/lib/suricata/rules
rule-files:
  # Emerging Threats Open — broad, real-world coverage (ADR-002). Produced and
  # pinned by the suricata-rules init container before Suricata starts.
  - suricata.rules
  # Lab-specific author rules — currently empty (see the file's header).
  - /etc/suricata/rules/local.rules
  # Pipeline-validation ONLY, never counted as detection (ADR-003).
  - /etc/suricata/rules/demo.rules

classification-file: /etc/suricata/classification.config
reference-config-file: /etc/suricata/reference.config

runmode: autofp
host-mode: auto

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      pcap-file: false
      community-id: true
      community-id-seed: 0
      types:
        - alert:
            payload: no
            payload-printable: no
            packet: no
            metadata: yes
            tagged-packets: yes
        - http:
            extended: yes
        - dns:
            query: yes
            answer: yes
        - tls:
            extended: yes
        - flow
        - stats:
            totals: yes
            threads: no
            deltas: no
  - fast:
      enabled: yes
      filename: fast.log
      append: yes

logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes
        type: json

af-packet:
  - interface: default
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
    use-mmap: yes
    tpacket-v3: yes

pcap:
  - interface: default

app-layer:
  protocols:
    http:
      enabled: yes
      libhtp:
        default-config:
          personality: IDS
          request-body-limit: 100kb
          response-body-limit: 100kb
          request-body-minimal-inspect-size: 32kb
          request-body-inspect-window: 4kb
          response-body-minimal-inspect-size: 40kb
          response-body-inspect-window: 16kb
    tls:
      enabled: yes
    dns:
      tcp:
        enabled: yes
        detection-ports:
          dp: 53
      udp:
        enabled: yes
        detection-ports:
          dp: 53
    ssh:
      enabled: yes

stream:
  memcap: 64mb
  checksum-validation: no
  inline: auto
  reassembly:
    memcap: 128mb
    depth: 1mb
    toserver-chunk-size: 2560
    toclient-chunk-size: 2560

defrag:
  memcap: 32mb

flow:
  memcap: 128mb

host:
  hash-size: 4096
  prealloc: 1000
  memcap: 32mb
