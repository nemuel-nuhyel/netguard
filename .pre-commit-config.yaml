# Pre-commit hooks — the local mirror of the CI gate (plan §6). Install with:
#   pipx install pre-commit && pre-commit install
# These stop the two red git findings (secret leak, .gitignore swallowing the
# project) from ever recurring before a commit is even made.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: check-gitignore
        name: gitignore guard (key files tracked, secrets ignored)
        entry: scripts/check-gitignore.sh
        language: script
        pass_filenames: false
      - id: check-demo-rules
        name: demo-rules guard (demo sids isolated + in sync)
        entry: scripts/check-demo-rules.sh
        language: script
        pass_filenames: false
      - id: check-hardening
        name: hardening guard (exposure, secrets, retention, image pins)
        entry: sh scripts/check-hardening.sh
        language: system
        pass_filenames: false
