name: netguard

services:
  wireguard:
    # Pinned by digest (F6): this container holds NET_ADMIN+SYS_MODULE, so a
    # floating :latest under those caps is exactly where supply-chain drift is
    # most dangerous. Re-pin deliberately via `docker buildx imagetools inspect`.
    image: lscr.io/linuxserver/wireguard@sha256:3abfd4b82212106e357989750b9c0c9859aa511f5305a9a55c18c8de7198b655
    container_name: netguard-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Budapest}
      SERVERURL: ${WG_SERVER_URL:-auto}
      SERVERPORT: ${WG_SERVER_PORT:-51820}
      PEERS: ${WG_PEERS:-lab-client}
      PEERDNS: ${WG_PEER_DNS:-auto}
      INTERNAL_SUBNET: ${WG_INTERNAL_SUBNET:-10.200.0.0}
      # Peer routes: protected lab + operator UI network + WireGuard subnet.
      # netguard-monitor deliberately stays private; use Grafana for its data.
      ALLOWEDIPS: ${WG_ALLOWED_IPS:-10.10.0.0/24,10.50.0.0/24,10.200.0.0/24}
      LOG_CONFS: "true"
    ports:
      - "${WG_SERVER_PORT:-51820}:51820/udp"
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv4.ip_forward: "1"
    volumes:
      - wireguard-config:/config
    networks:
      netguard-mgmt:
        ipv4_address: 10.50.0.10
      netguard-lab:
        ipv4_address: 10.10.0.10
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  monitored-app:
    image: nginx:1.27-alpine
    container_name: netguard-monitored-app
    networks:
      netguard-lab:
        ipv4_address: 10.10.0.20
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && pidof nginx >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  traffic-generator:
    build:
      context: ./services/traffic-generator
    container_name: netguard-traffic-generator
    environment:
      APP_URL: http://monitored-app/
      INTERVAL_SECONDS: ${TRAFFIC_INTERVAL_SECONDS:-10}
      DNS_PROBE_HOST: ${TRAFFIC_DNS_PROBE:-example.com}
      PORT_PROBE_HOST: monitored-app
      PORT_PROBE_PORTS: "80,8080"
    depends_on:
      monitored-app:
        condition: service_healthy
    networks:
      netguard-lab:
        ipv4_address: 10.10.0.30
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/traffic-generator.health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  attack-sim:
    build:
      context: ./services/attack-sim
    container_name: netguard-attack-sim
    profiles:
      - attack                          # opt-in; the default `up` stays benign
    environment:
      TARGET: ${ATTACK_TARGET:-http://10.10.0.20}
      TARGET_IP: ${ATTACK_TARGET_IP:-10.10.0.20}
      SIM_IP: 10.10.0.40
      SCENARIO: ${SCENARIO:-all}
      MODE: ${MODE:-catalogue}          # catalogue = labeled run for scoring
    cap_add:
      - NET_RAW                         # nmap -sS SYN scan needs raw sockets
    depends_on:
      monitored-app:
        condition: service_healthy
    networks:
      netguard-lab:                     # lab only — cannot reach netguard-monitor (invariant 2)
        ipv4_address: 10.10.0.40
    volumes:
      - ./runs:/runs                    # driver writes runs/<id>/manifest.json here
    # One-shot job run via `docker compose --profile attack run --rm attack-sim`.
    # No `restart` or `healthcheck` on purpose: it launches the catalogue once
    # and exits — a long-running/health model would be wrong for a batch job.

  suricata-rules:
    # One-shot init: fetch + pin ET Open into the suricata-rules volume before
    # Suricata starts (ADR-002). Needs internet egress, so it sits on
    # netguard-mgmt (bridge NAT), not host mode.
    image: jasonish/suricata:7.0.7
    container_name: netguard-suricata-rules
    entrypoint: ["/bin/sh", "/scripts/update-rules.sh"]
    environment:
      SURICATA_VERSION: "7.0.7"
      VERIFY: ${RULESET_VERIFY:-0}
    volumes:
      - suricata-rules:/var/lib/suricata
      - ./scripts/update-rules.sh:/scripts/update-rules.sh:ro
      - ./eval:/eval                     # writes the pinned eval/ruleset.lock
    networks:
      - netguard-mgmt
    restart: "no"

  suricata:
    image: jasonish/suricata:7.0.7
    container_name: netguard-suricata
    # Namespace-shared capture (ADR-001, F4): Suricata joins monitored-app's
    # network namespace and inspects its eth0, so it sees exactly the traffic
    # reaching the target — portably on Linux, Windows and macOS. Host mode
    # captured nothing usable on the author's Windows host.
    network_mode: "service:monitored-app"
    depends_on:
      suricata-rules:
        condition: service_completed_successfully
      monitored-app:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    # Bypass the image's entrypoint wrapper: it chowns the config files and,
    # under `set -e`, aborts (exit 1) when they are read-only bind mounts.
    # Running the suricata binary directly (as root, with the caps above) avoids
    # that and is the correct behaviour for our :ro config mounts.
    entrypoint: ["suricata"]
    # Interface is hardcoded to eth0: with namespace sharing that is always the
    # monitored app's interface. af-packet cannot capture on the 'any' pseudo
    # device inside a shared netns, so this must not be overridable by a stale
    # SURICATA_INTERFACE in .env.
    command:
      - -i
      - eth0
      - -k
      - none
      - -c
      - /etc/suricata/suricata.yaml
      - -l
      - /var/log/suricata
    volumes:
      - ./services/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./services/suricata/rules/local.rules:/etc/suricata/rules/local.rules:ro
      - ./services/suricata/rules/demo.rules:/etc/suricata/rules/demo.rules:ro
      - suricata-rules:/var/lib/suricata:ro   # ET Open (suricata.rules), populated by suricata-rules
      - suricata-logs:/var/log/suricata
    healthcheck:
      test: ["CMD-SHELL", "pidof suricata >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.8
    container_name: netguard-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      netguard-monitor:
        ipv4_address: 10.60.0.10
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.8
    container_name: netguard-promtail
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - promtail-positions:/tmp
      - suricata-logs:/var/log/suricata:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      netguard-monitor:
        ipv4_address: 10.60.0.20
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9080/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: netguard-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"     # loopback only (F5): local/SSH access; never the LAN
    networks:
      netguard-monitor:
        ipv4_address: 10.60.0.30
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  cadvisor:
    image: ${CADVISOR_IMAGE:-ghcr.io/google/cadvisor:v0.60.5}
    container_name: netguard-cadvisor
    profiles:
      - cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      netguard-monitor:
        ipv4_address: 10.60.0.40
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.3
    container_name: netguard-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Admin password via a Docker secret, not an env var (F5): keeps it out of
      # `docker inspect` and the container's process environment.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_METRICS_ENABLED: "true"
    secrets:
      - grafana_admin_password
    # Fail closed if a copied .env has a short/blank password (or retains the
    # old published example). The secret itself is never printed or exported.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        secret=/run/secrets/grafana_admin_password
        bytes=$$(wc -c < "$$secret")
        if [ "$$bytes" -lt 16 ] || grep -Fxq 'change-this-local-password' "$$secret"; then
          echo 'ERROR: set a unique GRAFANA_ADMIN_PASSWORD (16+ characters) in .env' >&2
          exit 1
        fi
        exec /run.sh
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"     # host loopback; VPN peers use private 10.50.0.20
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    networks:
      netguard-mgmt:
        ipv4_address: 10.50.0.20
      netguard-monitor:
        ipv4_address: 10.60.0.50
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

secrets:
  # Sourced from the .env variable, so there is no secret file in the tree.
  # Compose mounts it read-only at /run/secrets in the grafana container; the
  # password never appears in the container's environment or inspect output.
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD

networks:
  netguard-mgmt:
    name: netguard-mgmt
    driver: bridge
    ipam:
      config:
        - subnet: 10.50.0.0/24
  netguard-lab:
    name: netguard-lab
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
  netguard-monitor:
    name: netguard-monitor
    driver: bridge
    ipam:
      config:
        - subnet: 10.60.0.0/24

volumes:
  wireguard-config:
  suricata-rules:
  suricata-logs:
  loki-data:
  promtail-positions:
  prometheus-data:
  grafana-data:
